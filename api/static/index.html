<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Houston Price Receipt</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #fcfcfb; --panel: #ffffff; --ink: #1f1f1e; --muted: #6b6a66; --line: #e6e5e1;
    --low: #2a78d6; --expected: #8f8e89; --high: #d0453a;
    --ok: #2e7d4f; --warn: #b86e00; --unk: #8f8e89; --pos: #2e7d4f; --neg: #c2553d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  header form { display: flex; gap: 6px; flex: 1; min-width: 260px; }
  input, button, textarea { font: inherit; }
  input[type=text] { flex: 1; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; }
  button { padding: 7px 12px; border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 6px; cursor: pointer; }
  .legend { display: flex; gap: 12px; color: var(--muted); font-size: 12px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); height: calc(100vh - 54px); }
  #map { height: 100%; }
  #side { overflow-y: auto; padding: 16px; border-left: 1px solid var(--line); }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; height: auto; } #map { height: 55vh; } #side { border-left: 0; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .addr { font-size: 18px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .verdict { display: inline-block; padding: 2px 10px; border-radius: 12px; color: #fff; font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .kpis { display: flex; gap: 24px; margin: 10px 0; flex-wrap: wrap; }
  .kpi .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi .l { color: var(--muted); font-size: 12px; }
  .range { position: relative; height: 44px; margin: 18px 4px 6px; }
  .range .track { position: absolute; top: 18px; left: 0; right: 0; height: 6px; background: var(--line); border-radius: 3px; }
  .range .band { position: absolute; top: 14px; height: 14px; background: #c9c8c3; border-radius: 4px; }
  .range .mark { position: absolute; top: 8px; width: 2px; height: 26px; background: var(--ink); }
  .range .mark span { position: absolute; top: -16px; transform: translateX(-50%); font-size: 11px; white-space: nowrap; color: var(--muted); }
  .range .ask { position: absolute; top: 12px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--ink); }
  .range .ask span { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font-size: 11px; white-space: nowrap; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
  th, td { text-align: right; padding: 5px 6px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr.click { cursor: pointer; } tr.click:hover { background: #f4f3f0; }
  .sig { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .sig:last-child { border-bottom: 0; }
  .badge { flex: none; width: 74px; text-align: center; font-size: 11px; font-weight: 600; text-transform: uppercase; border-radius: 4px; padding: 2px 0; height: fit-content; color: #fff; }
  .sig .n { font-weight: 600; }
  ul { margin: 6px 0 0 18px; padding: 0; } li { margin: 2px 0; }
  .muted { color: var(--muted); }
  #chat { position: fixed; right: 16px; bottom: 16px; width: min(420px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.12); z-index: 1000; display: flex; flex-direction: column; max-height: 60vh; }
  #chat .log { overflow-y: auto; padding: 10px 12px; font-size: 13px; }
  #chat .msg { margin: 6px 0; white-space: pre-wrap; }
  #chat .msg.u { color: var(--muted); }
  #chat form { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
  #chat .tools { font-size: 11px; color: var(--muted); }
  #chat .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 13px; cursor: pointer; }
  #chat .bar button { padding: 0 8px; background: none; color: var(--muted); border: 0; font-size: 16px; }
  #chat.min .log, #chat.min form { display: none; }
  #chat.min .bar { border-bottom: 0; }
  #side { padding-bottom: 120px; }
  .empty { color: var(--muted); padding: 30px 6px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Houston Price Receipt</h1>
  <form id="search"><input id="q" type="text" placeholder="Address or zpid, e.g. 932 Bennington St or 27866230"><button>Report</button></form>
  <div class="legend">
    <span><i class="dot" style="background:var(--low)"></i>low (below q10)</span>
    <span><i class="dot" style="background:var(--expected)"></i>expected</span>
    <span><i class="dot" style="background:var(--high)"></i>high (above q90)</span>
  </div>
</header>
<main>
  <div id="map"></div>
  <div id="side"><div class="empty">Click a home on the map, or search an address or zpid, to see its due-diligence report.</div></div>
</main>
<div id="chat">
  <div class="bar" id="chatbar"><span>Ask the analyst</span><button aria-label="Minimize chat" id="chatmin">–</button></div>
  <div class="log" id="log"><div class="msg muted">Ask the analyst, e.g. "Find low-priced 3-bed homes under $350k near downtown" or "Report for 932 Bennington St".</div></div>
  <form id="chatf"><input id="cq" type="text" placeholder="Ask about Houston listings"><button>Send</button></form>
</div>
<script>
const COLORS = { low: "#2a78d6", expected: "#8f8e89", high: "#d0453a", unknown: "#8f8e89" };
const STATUS = { ok: "var(--ok)", warning: "var(--warn)", unknown: "var(--unk)" };
const fmt = v => typeof v === "number" ? "$" + Math.round(v).toLocaleString() : (v ?? "unknown");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const api = async (path, body) => {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
};

const map = L.map("map", { preferCanvas: true }).setView([29.76, -95.37], 10);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
  { attribution: "&copy; OpenStreetMap, &copy; CARTO", maxZoom: 19 }).addTo(map);
const homes = L.layerGroup().addTo(map), overlay = L.layerGroup().addTo(map);

api("/map?metric=label").then(gj => {
  gj.features.forEach(f => {
    const p = f.properties, [lon, lat] = f.geometry.coordinates;
    L.circleMarker([lat, lon], { radius: 4, weight: 0.5, color: "#fff", fillColor: COLORS[p.label] || COLORS.unknown, fillOpacity: 0.85 })
      .bindTooltip(`${fmt(p.price)} · ${p.label}<br>fair ${fmt(p.pred_price)} (${fmt(p.q10_price)}–${fmt(p.q90_price)})`)
      .on("click", () => loadReport({ zpid: p.zpid }))
      .addTo(homes);
  });
}).catch(e => side(`<div class="empty">Map failed: ${esc(e.message)}</div>`));

const side = html => (document.getElementById("side").innerHTML = html);
let chart;

async function loadReport(q) {
  side(`<div class="empty">Loading report…</div>`);
  try { renderReport(await api("/report", q)); } catch (e) { side(`<div class="empty">${esc(e.message)}</div>`); }
}

function rangeBar(p) {
  if (typeof p.fair !== "number") return `<p class="muted">${esc(p.reason || "No fair-price range for this listing.")}</p>`;
  const lo = Math.min(p.q10, p.asking) * 0.92, hi = Math.max(p.q90, p.asking) * 1.08, x = v => ((v - lo) / (hi - lo) * 100).toFixed(2) + "%";
  return `<div class="range"><div class="track"></div>
    <div class="band" style="left:${x(p.q10)};width:calc(${x(p.q90)} - ${x(p.q10)})"></div>
    <div class="mark" style="left:${x(p.q10)}"><span>q10 ${fmt(p.q10)}</span></div>
    <div class="mark" style="left:${x(p.fair)}"><span>fair ${fmt(p.fair)}</span></div>
    <div class="mark" style="left:${x(p.q90)}"><span>q90 ${fmt(p.q90)}</span></div>
    <div class="ask" style="left:${x(p.asking)};background:${COLORS[p.verdict]}"><span>asking ${fmt(p.asking)}</span></div></div>
    <p class="sub" style="margin-top:22px">Shaded band = calibrated 80% fair-price range (measured out-of-fold coverage ${p.range_coverage ?? "n/a"}).</p>`;
}

function renderReport(r) {
  const L_ = r.listing, p = r.price, c = r.costs.monthly;
  overlay.clearLayers();
  if (L_.lat) {
    map.setView([L_.lat, L_.lon], Math.max(map.getZoom(), 14), { animate: false });
    L.circleMarker([L_.lat, L_.lon], { radius: 9, weight: 3, color: "#1f1f1e", fillColor: COLORS[p.verdict], fillOpacity: 1 }).addTo(overlay);
    p.comps.forEach(k => L.circleMarker([k.lat, k.lon], { radius: 6, weight: 2, color: "#1f1f1e", fillOpacity: 0 })
      .bindTooltip(`comp ${fmt(k.price)} · $${k.ppsf}/sqft`).addTo(overlay));
  }
  const money = v => (typeof v === "number" ? "$" + v.toLocaleString(undefined, { maximumFractionDigits: 0 }) : `<span class="muted">${esc(v)}</span>`);
  side(`
  <section>
    <div class="addr">${esc(L_.street_address || "Address not disclosed")}</div>
    <div class="sub">${esc(L_.city || "")} ${esc(L_.zipcode || "")} · zpid ${L_.zpid} · ${esc((L_.home_type || "").replace("_", " ").toLowerCase())} ·
      ${L_.beds ?? "?"} bd / ${L_.baths ?? "?"} ba · ${L_.living_area ? L_.living_area.toLocaleString() + " sqft" : "sqft unknown"} · built ${L_.year_built ?? "?"}
      ${L_.hdp_url ? `· <a href="${esc(L_.hdp_url)}" target="_blank" rel="noopener">Zillow</a>` : ""}</div>
    ${r.address_matches ? `<div class="sub">Also matched: ${r.address_matches.slice(1).map(m => esc(m.address)).join("; ")}</div>` : ""}
  </section>
  <section>
    <h2>1 · Is the price reasonable?</h2>
    <span class="verdict" style="background:${COLORS[p.verdict]}">${esc(p.verdict)}</span>
    <div class="kpis">
      <div class="kpi"><div class="v">${fmt(p.asking)}</div><div class="l">asking</div></div>
      <div class="kpi"><div class="v">${fmt(p.fair)}</div><div class="l">fair (median model)</div></div>
      ${typeof p.asking_vs_fair_pct === "number" ? `<div class="kpi"><div class="v">${p.asking_vs_fair_pct > 0 ? "+" : ""}${p.asking_vs_fair_pct}%</div><div class="l">asking vs fair</div></div>` : ""}
    </div>
    ${rangeBar(p)}
    ${p.receipt.length ? `<h2 style="margin-top:16px">Price receipt (sums to fair price)</h2><div style="height:${60 + 28 * p.receipt.length}px"><canvas id="rc"></canvas></div>` : ""}
    <h2 style="margin-top:16px">Comparable listings <span class="muted" style="text-transform:none">(${esc(p.comps_rule || "none")})</span></h2>
    <table><tr><th>zpid</th><th>asking</th><th>$/sqft</th><th>sqft</th><th>bd/ba</th><th>km</th></tr>
      ${p.comps.map(k => `<tr class="click" data-z="${k.zpid}"><td>${k.zpid}</td><td>${fmt(k.price)}</td><td>$${k.ppsf}</td><td>${k.sqft.toLocaleString()}</td><td>${k.beds ?? "?"}/${k.baths ?? "?"}</td><td>${k.dist_km}</td></tr>`).join("")}
    </table>
  </section>
  <section>
    <h2>2 · Does the listing check out?</h2>
    ${r.verification.signals.map(s => `<div class="sig"><span class="badge" style="background:${STATUS[s.status]}">${esc(s.status)}</span>
      <div><div class="n">${esc(s.name.replaceAll("_", " "))}</div><div class="sub">${esc(s.evidence)}</div></div></div>`).join("")}
    <p class="sub">Evidence for a human to check, not a fraud score.</p>
  </section>
  <section>
    <h2>3 · What will it cost per month?</h2>
    <table>
      <tr><td>Mortgage (P&amp;I)</td><td>${money(c.mortgage)}</td></tr>
      <tr><td>Property tax</td><td>${money(c.tax)}</td></tr>
      <tr><td>HOA</td><td>${money(c.hoa)}</td></tr>
      <tr><td>Insurance</td><td>${money(c.insurance)}</td></tr>
      <tr><th style="text-align:left">Total of known items</th><th>${money(c.total_known)}</th></tr>
    </table>
    <div class="sub" style="margin-top:8px"><b>Assumptions</b><ul>${r.costs.assumptions.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>
    <div class="sub" style="margin-top:8px"><b>Unknown</b><ul>${r.costs.unknowns.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>
  </section>
  <section>
    <h2>Sources &amp; limitations</h2>
    <ul class="sub">${r.sources.map(s => `<li><b>${esc(s.name)}</b>: ${esc(s.detail)}${s.license ? ` (${esc(s.license)})` : ""}</li>`).join("")}</ul>
    <ul class="sub">${r.limitations.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
  </section>`);
  document.querySelectorAll("tr.click").forEach(tr => tr.onclick = () => loadReport({ zpid: +tr.dataset.z }));
  if (p.receipt.length) receiptChart(p.receipt);
}

function receiptChart(items) {
  if (chart) chart.destroy();
  const css = getComputedStyle(document.documentElement);
  chart = new Chart(document.getElementById("rc"), {
    type: "bar",
    data: { labels: items.map(i => i.label), datasets: [{
      data: items.map(i => i.usd),
      backgroundColor: items.map(i => i.feature === "baseline" ? "#8f8e89" : i.usd >= 0 ? css.getPropertyValue("--pos") : css.getPropertyValue("--neg")),
      borderRadius: 4, barThickness: 16 }] },
    options: { indexAxis: "y", maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${fmt(c.raw)} (${items[c.dataIndex].pct}% of fair)` } } },
      scales: { x: { grid: { color: "#e6e5e1" }, ticks: { callback: v => "$" + (v / 1000).toLocaleString() + "k", color: "#6b6a66" } },
                y: { grid: { display: false }, ticks: { color: "#1f1f1e", font: { size: 11 } } } } }
  });
}

document.getElementById("search").onsubmit = e => {
  e.preventDefault();
  const v = document.getElementById("q").value.trim();
  if (v) loadReport(/^\d+$/.test(v) ? { zpid: +v } : { address: v });
};

document.getElementById("chatbar").onclick = () => {
  const c = document.getElementById("chat"); c.classList.toggle("min");
  document.getElementById("chatmin").textContent = c.classList.contains("min") ? "+" : "–";
};
const qs = new URLSearchParams(location.search);
if (qs.get("zpid")) loadReport({ zpid: +qs.get("zpid") });
else if (qs.get("address")) loadReport({ address: qs.get("address") });

const chatHistory = [];
document.getElementById("chatf").onsubmit = async e => {
  e.preventDefault();
  const inp = document.getElementById("cq"), msg = inp.value.trim(), log = document.getElementById("log");
  if (!msg) return;
  inp.value = "";
  log.insertAdjacentHTML("beforeend", `<div class="msg u">${esc(msg)}</div><div class="msg" id="pending">Thinking…</div>`);
  log.scrollTop = log.scrollHeight;
  try {
    const r = await api("/chat", { message: msg, history: chatHistory });
    chatHistory.push({ role: "user", content: msg }, { role: "assistant", content: r.text });
    document.getElementById("pending").outerHTML = `<div class="msg">${esc(r.text)}<div class="tools">tools: ${r.tool_calls.map(t => t.tool).join(", ") || "none"} · ${esc(r.mode)}</div></div>`;
    for (const v of r.visuals) {
      if (v.type === "report") renderReport(v.data);
      if (v.type === "map") {
        overlay.clearLayers();
        const pts = v.data.features.map(f => [f.geometry.coordinates[1], f.geometry.coordinates[0], f.properties]);
        pts.forEach(([la, lo, p]) => L.circleMarker([la, lo], { radius: 7, weight: 2, color: "#1f1f1e", fillColor: COLORS[p.label] || "#8f8e89", fillOpacity: 0.9 })
          .bindTooltip(`${fmt(p.price)} · ${p.label}`).on("click", () => loadReport({ zpid: p.zpid })).addTo(overlay));
        if (pts.length) map.fitBounds(pts.map(p => [p[0], p[1]]), { maxZoom: 14, padding: [30, 30] });
      }
    }
  } catch (err) { document.getElementById("pending").outerHTML = `<div class="msg">Error: ${esc(err.message)}</div>`; }
  log.scrollTop = log.scrollHeight;
};
</script>
</body>
</html>
